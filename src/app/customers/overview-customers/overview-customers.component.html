@if (isAddingCustomer()) {
<app-new-customer (cancel)="onCancelAddCustomer()" (add)="onAddCustomer($event)" />
} @else {

    <nav class="navbar sub-nav">
            <div class="navbar-start">
                <div class="navbar-item">
                    <button class="button is-primary" (click)="onStartAddCustomer()"
                        (mouseenter)="hoverCreate.set(true)" (mouseleave)="hoverCreate.set(false)">
                        <span class="icon">
                            <i class="fa-solid fa-plus" [class.fa-beat]="hoverCreate()"></i>
                        </span>
                        <span>Add Customer</span>
                    </button>
                </div>
                <div class="navbar-item">
                    <label class="label" for="SortOptions">Sort by</label>
                <div class="field-body has-addons">
                    <p class="select">
                        <select id="SortOptions">
                            <option routerLink="./" [queryParams]="{sortBy: 'name'}" queryParamsHandling="merge">Name</option>
                            <option routerLink="./" [queryParams]="{sortBy: 'annualRevenue'}" queryParamsHandling="merge">Revenue</option>
                        </select>
                    </p>
                    <p class="control">
                        <button class="button" routerLink="./" [queryParams]="{sort: 'asc'}"
                            queryParamsHandling="merge">
                            <span class="icon is-small">
                                <i class="fa-solid fa-arrow-up-wide-short"></i>
                            </span>
                        </button>
                    </p>
                    <p class="control">
                        <button class="button" routerLink="./" [queryParams]="{sort: 'desc'}"
                            queryParamsHandling="merge">
                            <span class="icon is-small">
                                <i class="fa-solid fa-arrow-down-wide-short"></i>
                            </span>
                        </button>
                    </p>
                </div>
                </div>
            </div>
    </nav>
        


    <div class="content-area">
        @if(isLoading()) {
        <span class="icon-text">
            <span class="icon">
                <i class="fa-solid fa-spinner fa-spin-pulse"></i>
            </span>
            <span>Loading...</span>
        </span>
        } @else if (customers().length === 0) {
        <div class="no-customers">
            <p>No customers found.</p>
        </div>
        }
        <div>
            <ul id="customers">
                @for (customer of sortedCustomers(); track customer.customerId) {
                <app-customer [customer]="customer" />
                }
            </ul>
        </div>
    </div>

}
