<div class="modal is-active">
    <div class="modal-background"></div>
    <div class="modal-content">
        <form #authForm="ngForm" class="box" (ngSubmit)="onSubmit(authForm)">
            <div class="field">
              <label class="label" for="email">Email</label>
              <div class="control">
                <input class="input" type="email" id="email" placeholder="e.g. joe@example.com" name="email" ngModel required/>
              </div>
            </div>
          
            <div class="field">
              <label class="label" for="password">Password</label>
              <div class="control">
                <input class="input" type="password" placeholder="********" id="password" name="password" ngModel required/>
              </div>
            </div>
          
            <button class="button is-primary" type="submit" [disabled]="!authForm.valid">Login</button>
          </form>
    </div>
</div>
